name: Something doesn't work
description: A fault, a wrong behavior, a screen that doesn't do what it says.
labels: ["problema"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the time. Four fields, and the third one is usually the one
        that solves the report on its own.

  - type: textarea
    id: cosa
    attributes:
      label: What happened
      description: >-
        What you expected and what you saw instead. It doesn't have to be tidy.
      placeholder: |
        I pressed «Tidy this folder», it showed the plan, I confirmed, and
        three albums disappeared from the library.
    validations:
      required: true

  - type: textarea
    id: come
    attributes:
      label: How to get there
      description: >-
        The steps, even roughly. If it happens one time in ten, write that down:
        it's information, not an excuse.
    validations:
      required: true

  - type: textarea
    id: diario
    attributes:
      label: The log
      description: >-
        In Aether: **Settings → Updates → «Open the log folder»**. Inside there
        is `aether.log`: paste its last lines, or attach the file.

        It doesn't contain your track titles or the paths of your library —
        `PRIVACY.md` § 8 says what ends up in there and what doesn't. The only
        thing of yours in it is the path of the application folder, which
        contains your Windows account name: if you'd rather, delete it before
        pasting.

        **If Aether doesn't open at all**, the folder is
        `%APPDATA%\io.github.federicobaratti.aether\diario` — paste that into
        File Explorer's address bar.
      render: text
    validations:
      required: false

  - type: input
    id: versione
    attributes:
      label: Which version
      description: >-
        In Aether: **Settings → Updates → «Installed version»**.
      placeholder: "2.2.0"
    validations:
      required: true

  - type: input
    id: windows
    attributes:
      label: Which Windows
      placeholder: "Windows 11 Pro 24H2"
    validations:
      required: false
