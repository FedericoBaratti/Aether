# Il cancello di ogni commit: le stesse cose che `npm run verify` fa in locale,
# piu' la build del desktop.
#
# La build sta qui e non solo nel rilascio perche' i tre bundle di electron-vite
# hanno risolutori diversi da quelli di vitest: un import che gira nei test puo'
# non risolversi nel bundle del main, e scoprirlo al momento del tag e' scoprirlo
# tardi.

name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  # Un push che ne supera un altro annulla il giro precedente: su un ramo attivo
  # interessa l'esito dell'ultimo commit, non di tutti.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # --ignore-scripts: nessun modulo nativo serve per typecheck, lint e test
      # (l'adapter separa `adaptBetterSqlite`, che si prova con un doppio, da
      # `openBetterSqlite`, l'unico punto che carica il .node). Saltare gli script
      # toglie un paio di minuti di ricompilazione e una fonte di guasti che non
      # riguardano il codice.
      - run: npm ci --ignore-scripts

      - run: npm run verify

      - run: npm run build:desktop
