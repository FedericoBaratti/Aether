# Da un tag a un installer scaricabile.
#
# # Cosa non fa ancora, e perché è scritto qui e non altrove
#
# **Non firma il codice.** Il blocco `bundle.windows.signCommand` in
# `tauri.conf.json` non c'è, perché un certificato OV richiede la validazione
# dell'identità di chi lo chiede — settimane, e un costo annuo. Finché non c'è,
# **SmartScreen mostra un avviso a chiunque scarichi**, ed è il singolo motivo
# per cui la maggior parte delle applicazioni indipendenti non viene installata.
# La release lo dice nel proprio corpo invece di lasciarlo scoprire.
#
# # L'updater, e la cosa da sapere prima di premere «pubblica»
#
# La release nasce **bozza**, e questo interagisce con l'updater in un modo che
# conviene aver capito: `plugins.updater.endpoints` punta a
# `/releases/latest/download/latest.json`, e `/releases/latest` **salta le
# bozze**. Finché la release resta bozza, quindi, nessuna copia installata di
# Aether la vede: si può scaricare l'installer a mano dalla pagina, provarlo, e
# accorgersi che qualcosa non va senza che nel frattempo si sia aggiornato
# nessuno.
#
# Pubblicare la bozza **è** il gesto che spedisce l'aggiornamento a tutti. Non è
# un effetto collaterale da correggere: è l'unico momento in cui una persona
# guarda la cosa prima che parta, ed è messo lì apposta.
#
# # Perché le azioni sono inchiodate a un hash e non a un'etichetta
#
# Perché `actions/checkout@v4` non nomina una versione: nomina un'**etichetta**,
# e chi possiede quel repository può spostarla su un altro commit senza che qui
# cambi una riga. Non è un timore di scuola: nel marzo del 2025 le etichette di
# `tj-actions/changed-files` sono state riscritte, e ventitremila repository
# hanno eseguito codice nuovo credendo di eseguire quello di prima.
#
# Il conto di quel giorno, qui, non sarebbe una build sporca: questo lavoro
# monta `TAURI_SIGNING_PRIVATE_KEY` nell'ambiente, e la riga sotto spiega cosa
# vuol dire perderla. Un hash è l'unico riferimento che nessuno può spostare.
#
# Il prezzo è che le azioni non si aggiornano più da sole. Si aggiornano a mano,
# leggendo la versione dal commento accanto all'hash.
#
# Le chiavi di firma stanno nei segreti del repository come
# `TAURI_SIGNING_PRIVATE_KEY` e `TAURI_SIGNING_PRIVATE_KEY_PASSWORD`. La privata
# non è recuperabile e non è sostituibile: gli eseguibili già installati si
# fidano solo di quella, e perderla vuol dire che nessuno di loro si aggiornerà
# mai più — andrebbero tutti reinstallati a mano. Una copia fuori da questo
# computer e fuori da GitHub.

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Il tag da rilasciare, per esempio v0.2.0"
        required: true

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      # Il tag dice una versione, i tre file ne dicono un'altra: costruire lo
      # stesso è produrre un installer che si chiama in un modo e dichiara
      # l'altro. È il difetto che `strumenti/versione.js` esiste per impedire, e
      # questo è il punto in cui conta.
      #
      # # Perché il tag passa dall'ambiente e non da `${{ }}`
      #
      # Perché `${{ inputs.tag }}` scritto dentro un `run:` non è una variabile:
      # è una sostituzione di testo che avviene **prima** che bash veda la riga.
      # Un tag che contiene `$(…)` smette di essere un tag e diventa un comando,
      # dentro il lavoro che ha in mano `TAURI_SIGNING_PRIVATE_KEY`.
      #
      # Non è un varco verso l'interno — chi può lanciare a mano questo workflow
      # ha già i permessi di scrittura sul repository. È che il varco che c'è non
      # deve passare accanto a quella chiave. Nell'ambiente il tag resta un dato,
      # qualunque cosa ci sia scritto.
      #
      # # Perché `ref_type` e non `${GITHUB_REF_NAME:-…}`
      #
      # Perché su `workflow_dispatch` `GITHUB_REF_NAME` **c'è**: è il ramo da cui
      # si è lanciato. Il valore di riserva non sarebbe quindi mai caduto
      # sull'input, e un rilascio a mano avrebbe confrontato la versione dei file
      # con la parola «main».
      - name: Il tag coincide con la versione
        id: versione
        shell: bash
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          TAG_INPUT: ${{ inputs.tag }}
        run: |
          if [ "$REF_TYPE" = "tag" ]; then tag="$REF_NAME"; else tag="$TAG_INPUT"; fi
          if [ -z "$tag" ]; then
            echo "nessun tag: né un ref di tipo tag, né l'input di workflow_dispatch"
            exit 1
          fi
          atteso="${tag#v}"
          node strumenti/versione.js
          trovato=$(node -p "require('./apps/desktop/package.json').version")
          if [ "$trovato" != "$atteso" ]; then
            echo "il tag dice $atteso, i file dicono $trovato"
            exit 1
          fi
          # Dopo il confronto e non prima: qui `$tag` è `v` più una versione che
          # `package.json` ha appena confermato, cioè un testo su una riga sola.
          # È la stessa uguaglianza che gli impedisce di portare un a capo dentro
          # gli output del passo.
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      # Prima di compilare, e non dopo.
      #
      # `tauri build` la chiave la guarda per ultima: compila in release, scarica
      # NSIS, produce l'installer, e **poi** prova a firmare. Alla v2.0.1 il
      # segreto era arrivato spezzato, e la corsa è morta dopo tredici minuti
      # dicendo «Missing comment in secret key» — un guasto da incollatura,
      # scoperto al prezzo di una compilazione intera. Qui costa un secondo.
      #
      # Non guarda che la password sia giusta né che la chiave sia *quella*: la
      # prima si saprebbe solo aprendo la chiave, la seconda solo dopo aver
      # firmato, ed è il mestiere di `manifesto.js` più sotto. Qui si tolgono di
      # mezzo gli errori di forma, che sono quelli che si fanno davvero.
      - name: La chiave di firma è quella che sembra
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: node strumenti/firma.js

      # Gli avvisi sulle licenze si rigenerano **qui** e si confrontano: un
      # `THIRD-PARTY-NOTICES.md` vecchio di tre aggiornamenti di dipendenze è un
      # obbligo di attribuzione non rispettato, e non se ne accorge nessuno
      # finché non è un problema legale.
      - name: Gli avvisi sulle licenze sono aggiornati
        shell: bash
        run: |
          node strumenti/licenze.js
          if ! git diff --quiet -- THIRD-PARTY-NOTICES.md; then
            echo "THIRD-PARTY-NOTICES.md non è aggiornato."
            echo "Rigenerarlo con: node strumenti/licenze.js"
            git --no-pager diff --stat -- THIRD-PARTY-NOTICES.md
            exit 1
          fi

      - name: Prove
        run: cargo test --workspace

      # Le due variabili non sono facoltative: senza, `createUpdaterArtifacts`
      # non produce nessun `.sig`, e il passo del manifesto si ferma dicendolo.
      # Meglio là che qui — un `if` che salta l'updater in silenzio darebbe una
      # release apparentemente riuscita che nessuno può installare.
      - name: Installer
        working-directory: apps/desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          npm ci
          npm run build

      # ── la firma andrebbe qui ────────────────────────────────────────────
      # Con un certificato in mano, il passo non è questo: si aggiunge
      # `bundle.windows.certificateThumbprint` (o `signCommand`) in
      # `tauri.conf.json`, e `tauri build` firma da sé sia l'eseguibile sia
      # l'installer. Un passo di firma qui, dopo il bundle, firmerebbe
      # l'installer e non il binario dentro.

      - name: Raccogli quel che è uscito
        shell: bash
        run: |
          mkdir -p uscita
          cp apps/desktop/src-tauri/../../../target/release/bundle/nsis/*.exe uscita/ 2>/dev/null \
            || cp target/release/bundle/nsis/*.exe uscita/
          # Il `.sig` va fra gli asset anche se il manifesto ne porta già il
          # contenuto: è quel che permette a chiunque di verificare da sé, con
          # `minisign -Vm`, che l'installer scaricato a mano sia lo stesso che
          # l'updater avrebbe installato.
          cp target/release/bundle/nsis/*.sig uscita/
          cp LICENSE THIRD-PARTY-NOTICES.md PRIVACY.md TERMS.md uscita/
          ls -la uscita

      # Dopo la raccolta e **prima** della pubblicazione: qui dentro c'è il
      # confronto fra l'identificativo della chiave che ha firmato e quello
      # della chiave che gli eseguibili già installati conoscono. È l'unico
      # posto in tutta la catena in cui quel disallineamento si può ancora
      # scoprire senza che lo racconti un utente.
      - name: Il manifesto dell'updater
        shell: bash
        run: node strumenti/manifesto.js uscita

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: aether-windows
          path: uscita/

      - name: Pubblica la release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: uscita/*
          draft: true
          # Il tag calcolato sopra e non `github.ref`: su `workflow_dispatch` il
          # ref è il ramo, e la release si chiamerebbe «main».
          tag_name: ${{ steps.versione.outputs.tag }}
          body: |
            ## Aether ${{ steps.versione.outputs.tag }}

            Vedi `CHANGELOG.md` per cosa è cambiato.

            ### Prima di installare

            **Questo installer non è firmato.** Windows SmartScreen mostrerà un
            avviso: «Windows ha protetto il PC». Per procedere: *Ulteriori
            informazioni* → *Esegui comunque*.

            Non è una formalità e non va data per scontata. Un installer non
            firmato è un installer di cui non puoi verificare la provenienza,
            e l'unica cosa che posso offrire in cambio è che il sorgente sta
            qui e si compila da sé. Un certificato OV richiede validazione
            dell'identità e un costo annuo: quando ci sarà, questo avviso
            sparirà da queste note.

            ### Da dove arriva la musica

            Aether suona i tuoi file, e quel che manca lo cerca nei **cataloghi
            liberi**. Non scarica da YouTube e non fa scraping di Spotify: il
            perché sta in `README.md`. Quel che nessun catalogo libero ha
            finisce in una lista d'acquisto, non in un errore.

            ### Licenze

            `LICENSE` (MIT), `THIRD-PARTY-NOTICES.md` (le dipendenze, con i
            loro testi), `PRIVACY.md` (ogni richiesta di rete che il programma
            può fare), `TERMS.md` (cosa puoi fare della musica che scarichi —
            compreso il vincolo **non commerciale** del Live Music Archive).

      # ── e adesso la bozza va guardata ────────────────────────────────────
      # Restano due gesti a mano, e sono entrambi voluti:
      #
      #   1. scaricare l'installer dalla bozza e provarlo su una macchina vera.
      #      Le prove dicono che il codice fa quel che deve; non dicono che
      #      l'installer parta;
      #   2. pubblicare la bozza. Da quel momento `/releases/latest` la vede, e
      #      ogni copia di Aether accesa nel mondo se ne accorge entro mezz'ora.
      #
      # Automatizzare il secondo si può in due righe. Non si fa: è l'unico punto
      # della catena in cui una persona guarda la cosa prima che parta.
