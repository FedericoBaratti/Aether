# Costruisce gli installer per un tag `v*` e li appende a una BOZZA di release.
#
# Bozza e non pubblicazione: gli artefatti vanno provati su una macchina vera
# prima che qualcuno li scarichi, e `publish: null` in electron-builder.yml dice
# la stessa cosa dall'altro lato. Il passo che rende pubblica una versione resta
# un clic di una persona.
#
# Si puo' lanciare anche a mano (`workflow_dispatch`) per provare la catena di
# impacchettamento senza creare un tag.

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Il cancello prima di tutto: un tag non deve poter produrre un installer da
  # un albero che non passa i test.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run verify

  build:
    needs: verify
    strategy:
      # Un guasto su macOS non deve buttare via l'installer di Windows gia'
      # costruito: gli altri sistemi finiscono comunque.
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: dist:win
            artifacts: |
              apps/desktop/release/*.exe
              apps/desktop/release/*.blockmap
          - os: macos-latest
            script: dist:mac
            artifacts: apps/desktop/release/*.dmg
          - os: ubuntu-latest
            script: dist:linux
            artifacts: |
              apps/desktop/release/*.AppImage
              apps/desktop/release/*.deb

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Passo esplicito, e deve restare tale: better-sqlite3 va compilato per
      # l'ABI di Electron, non per quello di Node. electron-builder non lo fa
      # piu' da solo (npmRebuild: false) perche' nel monorepo quel passo pota le
      # devDependencies issate alla radice — vedi il commento in
      # apps/desktop/electron-builder.yml.
      - run: npm run rebuild:native

      - run: npm run ${{ matrix.script }} -w apps/desktop

      - uses: actions/upload-artifact@v4
        with:
          name: aether-${{ matrix.os }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error

  draft:
    needs: build
    runs-on: ubuntu-latest
    # Solo per i tag: un `workflow_dispatch` serve a provare la catena, non a
    # creare una release.
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: artifacts/**/*
          generate_release_notes: true
