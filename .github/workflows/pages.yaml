name: Pubblica sito su GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  SITO: https://rymembra.com

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # serve la cronologia completa per le date lastmod

      - name: Genera sitemap.xml
        working-directory: site
        run: |
          {
            echo '<?xml version="1.0" encoding="UTF-8"?>'
            echo '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">'
            find . -name '*.html' ! -name '404.html' -not -path './node_modules/*' | sort | while read -r f; do
              p="${f#./}"
              case "$p" in
                index.html)   url="$SITO/" ;;
                */index.html) url="$SITO/${p%index.html}" ;;
                *)            url="$SITO/$p" ;;
              esac
              data=$(git log -1 --format=%cs -- "$f")
              [ -z "$data" ] && data=$(date -u +%F)
              echo "  <url><loc>$url</loc><lastmod>$data</lastmod></url>"
            done
            echo '</urlset>'
          } > sitemap.xml
          cat sitemap.xml

      - name: Crea robots.txt se manca
        working-directory: site
        run: |
          if [ ! -f robots.txt ]; then
            printf 'User-agent: *\nAllow: /\n\nSitemap: %s/sitemap.xml\n' "$SITO" > robots.txt
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
