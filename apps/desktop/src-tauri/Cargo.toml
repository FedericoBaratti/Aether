[package]
name = "aether-desktop"
description = "L'applicazione desktop: una finestra sopra il nucleo, niente logica propria."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

# Il binario si chiama `aether`, non `aether-desktop`: è il nome che l'utente
# vede nel gestore attività e nella barra delle applicazioni.
[[bin]]
name = "aether"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
aether-app = { path = "../../../core/aether-app" }
aether-play = { path = "../../../core/aether-play" }
aether-cloud = { path = "../../../core/aether-cloud" }
aether-domain = { path = "../../../core/aether-domain" }
# Per portare dentro la copertina di Spotify da incorporare nei tag di un brano
# appena scaricato. Stessa `Rete` che usa `aether-spotify`, così l'agente e i
# timeout sono quelli, non una seconda idea di cosa sia una richiesta HTTP.
aether-net = { path = "../../../core/aether-net" }
# La lettura dell'archivio che Spotify manda per posta: la via che non chiede
# nessuna chiave e nessun abbonamento. Non vede `rusqlite`, ed e` quel che rende
# impossibile tenere preso il lucchetto della libreria mentre si scompatta uno
# zip da trecento megabyte.
aether-archivio = { path = "../../../core/aether-archivio" }
# Il portachiavi di sistema, con la feature accesa: dove i segreti stanno lo
# decide chi ha un sistema operativo sotto, cioe` questo crate. I crate del
# nucleo lo dichiarano `default-features = false` proprio per non decidere al
# posto suo.
aether-oauth = { path = "../../../core/aether-oauth", features = ["portachiavi"] }
# Solo per costruire i `Fornitori` che il filo dell'arricchimento tiene vivi fra
# una passata e l'altra: dentro ci sono la riserva di connessioni e — quel che
# conta — lo stato degli interruttori, che rinascendo a ogni passata non
# riuscirebbe mai a ricordare che MusicBrainz è giù.
aether-meta = { path = "../../../core/aether-meta" }
# I due protocolli di scrobbling. La coda sta in `aether-app` e non conosce la
# rete; questo crate mette in mezzo le credenziali e il filo che svuota.
aether-scrobble = { path = "../../../core/aether-scrobble" }
aether-skin = { path = "../../../core/aether-skin" }
aether-spotify = { path = "../../../core/aether-spotify" }
aether-yt = { path = "../../../core/aether-yt" }
# La stessa versione che usa `aether-app`: due `rusqlite` diversi nell'albero
# darebbero due tipi `Connection` incompatibili, e l'errore che ne esce parla di
# tratti non implementati invece che di versioni.
rusqlite = { version = "0.37", features = ["bundled"] }
serde.workspace = true
serde_json.workspace = true
# Senza `protocol-asset`: le copertine passano da uno schema nostro, che accetta
# un'impronta e non un percorso. Il protocollo generale servirebbe file
# arbitrari dietro una lista di cartelle permesse — più superficie, per una cosa
# che non ci serve.
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
# La schermata di consenso di Google si apre nel browser di **sistema**, mai
# nella webview: una finestra dell'app che sa disegnare `accounts.google.com` è
# una superficie di phishing, e allargare il CSP per sempre per un'operazione da
# cinque minuti l'anno non si fa.
tauri-plugin-opener = "2"

[dev-dependencies]
# Installare una skin scrive un file: provarlo vuol dire una cartella vera che
# sparisce da sé. La stessa versione di `aether-app` e `aether-play`.
tempfile = "3"

[lints]
workspace = true
