# Impacchettamento del desktop.
#
# Ereditata dalla configurazione del legacy, che aveva gia' pagato le due
# decisioni non ovvie (asarUnpack per i moduli nativi, extraResources per i
# binari esterni). Quel che cambia qui e' il monorepo: la app non e' piu' la
# radice del repository, e questo tocca sia `files` sia la risoluzione dei
# moduli.
#
# Verificato con `npm run pack:dir -w apps/desktop`, che produce
# `release/win-unpacked` senza firmare e senza installer: e' il controllo
# veloce che l'impacchettamento regge.

appId: com.aether.player
productName: Aether

directories:
  output: release
  buildResources: resources

# Solo il bundle e il manifest. I pacchetti `@aether/*` NON compaiono qui e non
# devono: electron-vite li transpila DENTRO out/, perche' esportano TypeScript
# sorgente senza passo di build. Sono percio' dipendenze di compilazione, e
# stanno in devDependencies — altrimenti electron-builder seguirebbe il loro
# collegamento simbolico fuori dalla cartella della app e impacchetterebbe dei
# .ts che a runtime nessuno carica.
files:
  - out/**
  - package.json

# I moduli nativi non possono stare dentro l'archivio asar: il caricatore di
# Node vuole un percorso vero sul filesystem per una .node. Vale per
# better-sqlite3 e per sharp.
asarUnpack:
  - '**/*.node'

# NON ricostruire i moduli nativi durante l'impacchettamento.
#
# Non e' un'ottimizzazione, e' una riparazione. Con le dipendenze issate alla
# radice del monorepo, quel passo fa una installazione di sole dipendenze di
# PRODUZIONE con `appDir` su apps/desktop, e quel che pota sono le
# devDependencies della radice: la prima esecuzione qui dentro ha cancellato
# electron, electron-vite, vite, electron-builder e i @types dall'albero, e ci e'
# voluto un `npm install --offline` per rimetterli. Un comando di build non deve
# poter smontare l'ambiente di sviluppo.
#
# La ricostruzione resta necessaria — better-sqlite3 va compilato per l'ABI di
# Electron, non per quello di Node — ma diventa un passo esplicito e visibile:
# `npm run rebuild:native` dalla radice, prima di impacchettare. Vedi
# docs/rilascio.md.
npmRebuild: false

win:
  target:
    - nsis
    - portable
  icon: resources/icon.ico
  # La firma e' opzionale e non configurata: senza certificato electron-builder
  # produce comunque l'installer, non firmato. Vedi docs/rilascio.md.
  signtoolOptions:
    signingHashAlgorithms:
      - sha256
    rfc3161TimeStampServer: http://timestamp.digicert.com

nsis:
  # Non a un clic: l'utente deve poter scegliere dove installare, perche' la
  # libreria musicale e il database stanno accanto ai suoi dati e non tutti
  # vogliono la cartella predefinita.
  oneClick: false
  allowToChangeInstallationDirectory: true

mac:
  target:
    - dmg
  category: public.app-category.music
  # `null` = nessuna firma. Su macOS questo significa che l'utente deve
  # autorizzare l'app a mano al primo avvio: e' una scelta consapevole finche'
  # non c'e' un account sviluppatore.
  identity: null

linux:
  target:
    - AppImage
    - deb
  category: Audio
  icon: resources/icon-256.png

# Nessuna pubblicazione automatica. Il caricamento degli artefatti lo fa il
# workflow di rilascio, che crea una bozza di release: un `git push --tags`
# non deve poter pubblicare da solo.
publish: null
