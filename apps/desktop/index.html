<!doctype html>
<html lang="it" data-skin="plain" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      CSP restrittiva: nessuno script inline, nessuna connessione esterna. Il
      formato skin non ha bisogno di niente di tutto questo — non carica url(),
      non importa fogli, non esegue codice — quindi la politica può essere severa
      senza limitare nessuna funzione.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: aether:; media-src 'self' blob: aether:; font-src 'self' data:; connect-src 'self'"
    />
    <title>Aether</title>
    <style>
      /*
        Lo splash prima del primo fotogramma. Il colore viene dal token della skin
        attiva quando c'è, e cade su questo solo al primissimo avvio — nel legacy
        era cablato a #09090d in due posti, quindi con un'altra skin l'avvio
        lampeggiava del colore sbagliato.
      */
      html,
      body,
      #root {
        height: 100%;
        margin: 0;
      }
      body {
        background: var(--color-surface-0, #09090d);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
