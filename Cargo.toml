# Il workspace di tutto il repo.
#
# Stava in `core/`, quando in Rust c'era solo il nucleo. Con l'arrivo dell'app
# desktop il posto giusto è la radice: un membro fuori dalla cartella del
# workspace è legale ma bugiardo, e soprattutto un `cargo test` dalla radice
# deve costruire e provare anche l'app, non solo le librerie che usa.

[workspace]
resolver = "3"
members = [
    "core/aether-domain",
    "core/aether-play",
    "core/aether-app",
    "core/aether-skin",
    "core/aether-net",
    "core/aether-meta",
    "core/aether-oauth",
    "core/aether-archivio",
    "core/aether-cloud",
    "core/aether-scrobble",
    "core/aether-spotify",
    "core/aether-yt",
    "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
authors = ["Federico Baratti"]
repository = "https://github.com/federicobaratti/aether"

[workspace.dependencies]
unicode-normalization = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# ── la nuvola ───────────────────────────────────────────────────────────────
# Queste stanno qui e non in `aether-cloud` perché prima o poi le vorrà anche
# qualcun altro (il recupero delle copertine, l'arricchimento da MusicBrainz), e
# due versioni diverse di uno stack TLS nello stesso binario sono megabyte
# duplicati.
#
# `ureq` e non `reqwest`: è bloccante, e tutto Aether è bloccante. Un runtime
# asincrono per fare quattro richieste HTTP ogni quarto d'ora vorrebbe dire
# portarsi dietro tokio — e con lui una seconda idea di cos'è un errore, di
# cos'è un timeout e di chi possiede un thread.
ureq = "3"
flate2 = "1"
sha2 = "0.10"
getrandom = "0.3"
keyring = { version = "3", features = ["windows-native"] }
# `default-features = false` più il solo `deflate`: bzip2, zstd, lzma, xz e ppmd
# porterebbero altrettante catene di compilazione C per formati che né una skin
# né un archivio di Spotify usano. Serve a due crate — `aether-skin` per i
# pacchetti `.aeskin`, `aether-archivio` per i dati che Spotify manda — e sta
# qui perché due versioni diverse dello stesso decompressore nello stesso
# binario sono megabyte duplicati.
zip = { version = "6", default-features = false, features = ["deflate"] }

[workspace.lints.rust]
# Il dominio non ha bisogno di unsafe. Vietato, non scoraggiato: se un giorno
# servisse davvero, deve essere una decisione visibile in questo file.
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
# Le operazioni che possono terminare il processo vanno scritte per esteso.
# Un `unwrap()` in un modulo di dominio non fa cadere una funzione: fa cadere
# l'app dell'utente mentre ascolta.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
integer_division = "warn"
cast_possible_truncation = "warn"
cast_sign_loss = "warn"

# I profili di rilascio: il nucleo gira anche su telefono, dove ogni MB
# dell'.so e ogni millisecondo di avvio si vedono.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
