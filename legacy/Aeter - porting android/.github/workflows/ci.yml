name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # postinstall runs electron-builder install-app-deps, which rebuilds
      # better-sqlite3 for Electron's ABI (~1-2 min). Tests themselves only
      # need node:sqlite, so if this step ever flakes the fallback is a
      # test-only job with `npm ci --ignore-scripts`.
      - run: npm ci

      - run: npm run typecheck

      - run: npm test

      - run: npm run build
