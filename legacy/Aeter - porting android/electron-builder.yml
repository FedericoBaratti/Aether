appId: com.aether.player
productName: Aether
directories:
  output: release
files:
  - out/**
  - package.json
extraResources:
  - from: resources/bin
    to: bin
    filter:
      - '**/*'
asarUnpack:
  - '**/*.node'
win:
  target:
    - nsis
    - portable
  icon: resources/icon.ico
  signtoolOptions:
    signingHashAlgorithms:
      - sha256
    rfc3161TimeStampServer: http://timestamp.digicert.com
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
mac:
  target:
    - dmg
  category: public.app-category.music
  identity: null
linux:
  target:
    - AppImage
    - deb
  category: Audio
publish: null
