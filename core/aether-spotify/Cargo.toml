[package]
name = "aether-spotify"
description = "Il lettore keyless di Spotify: risolve un link pubblico in una lista di brani, senza chiavi né account."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
aether-domain = { path = "../aether-domain" }
# Il consenso dell'account: PKCE, il socket di loopback, il portachiavi.
# `default-features = false` lascia fuori `keyring`: chi decide dove tenere i
# segreti e` la finestra, non un lettore di elenchi.
aether-oauth = { path = "../aether-oauth", default-features = false }
aether-net = { path = "../aether-net" }
# L'identificativo di dispositivo della stretta di mano anonima: sedici byte
# casuali, non un contatore. Vedi `sessione`.
getrandom.workspace = true
# HMAC-SHA1, che il TOTP di Spotify richiede. Nel workspace c'era solo `sha2`
# (SHA-256), che è un algoritmo diverso e non serve a questo.
hmac = "0.12"
serde.workspace = true
serde_json.workspace = true
sha1 = "0.10"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
