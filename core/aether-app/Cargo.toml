[package]
name = "aether-app"
description = "Orchestrazione di Aether: database, rete, filesystem. Il dominio sta in aether-domain."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
aether-domain = { path = "../aether-domain" }
blake3 = "1.8.5"
image = { version = "0.25.9", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp", "rayon"] }
imagesize = "0.15.0"
lofty = "0.24.0"
# `bundled`: SQLite compilato da sorgente e incluso nel binario. Non è comodità
# — è l'unico modo di avere la STESSA versione di SQLite e le stesse opzioni di
# compilazione sul desktop e dentro l'APK. Su Android il SQLite di sistema
# cambia da versione a versione, e FTS5 non è garantito: è il motivo per cui il
# vecchio porting doveva ripiegare su `LIKE` per la ricerca.
rusqlite = { version = "0.37", features = ["bundled", "functions"] }
# Il dominio non serializza niente da sé, ed è una regola che vale per il
# dominio: là una `derive` costringerebbe le decisioni pure ad avere
# un'opinione su come vengono trasmesse. Qui è diverso — questo crate esiste
# per parlare col mondo, e i tipi di lettura della libreria attraversano l'IPC
# verso la finestra e il ponte verso Android. Rimirarli a mano da ogni
# consumatore sarebbe la duplicazione che questo ramo esiste per togliere.
serde.workspace = true
walkdir = "2.5.0"

[dev-dependencies]
# Serve a datare un file di prova: due scritture di fila cadono nello stesso
# millisecondo, e il piano di scansione le vedrebbe come «invariato».
filetime = "0.2"
tempfile = "3"

[lints]
workspace = true
